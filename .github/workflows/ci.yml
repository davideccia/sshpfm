name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: vet, test, type-check
    runs-on: ubuntu-latest
    env:
      # Wails links WebKitGTK through cgo on Linux; ubuntu-latest ships
      # webkit2gtk-4.1, which Wails selects with this tag (as make
      # build-linux does).
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: make check
        run: make check
