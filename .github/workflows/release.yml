name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "lts/*"
  WAILS_VERSION: "v2.16.0"

jobs:
  build-macos:
    name: macOS universal (.app + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build universal .app
        run: make build-mac

      - name: Package .dmg
        run: make dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshpfm-macos
          path: build/bin/*.dmg

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.dmg

  build-windows:
    name: Windows amd64 (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build installer
        run: wails build -platform windows/amd64 -clean -nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshpfm-windows
          path: |
            build/bin/*.exe

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.exe

  build-linux:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build binary
        run: make build-linux

      - name: Package tarball
        run: |
          cd build/bin
          tar -czf sshpfm-linux-amd64.tar.gz sshpfm

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshpfm-linux
          path: build/bin/sshpfm-linux-amd64.tar.gz

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/sshpfm-linux-amd64.tar.gz
