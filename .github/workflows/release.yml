name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "lts/*"

# Go comes from go.mod and the Wails CLI from the library version go.mod
# pins, so neither can drift from what the code is built against.
jobs:
  build-macos:
    name: macOS universal (.app + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      # `make dmg` builds and signs the universal .app first.
      - name: Build and package .dmg
        run: make dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshpfm-macos
          path: build/bin/*.dmg

      # Attach only when running on a tag: a published release, or the
      # dispatch release-on-commit.yml starts on the new tag. A manual run
      # on a branch has no release to attach to and keeps the artifact.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.dmg

  build-windows:
    name: Windows amd64 (installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Build installer
        run: wails build -platform windows/amd64 -clean -nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshpfm-windows
          path: build/bin/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.exe

  build-linux:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Build binary
        run: make build-linux

      - name: Package tarball
        run: |
          cd build/bin
          tar -czf sshpfm-linux-amd64.tar.gz sshpfm

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshpfm-linux
          path: build/bin/sshpfm-linux-amd64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/sshpfm-linux-amd64.tar.gz
